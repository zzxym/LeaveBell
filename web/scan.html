<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放学扫码</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="app">
  <main class="app-main">
    <!-- 选班级页 -->
    <section id="pick" class="panel">
      <div class="panel-inner">
        <h1>放学扫码</h1>
        <p class="hint">请选择要操作的班级</p>
        <div class="class-picker">
          <input id="yearInp" list="yearList" type="number" min="1" max="12" placeholder="年级" autocomplete="off">
          <span class="picker-sep">年</span>
          <input id="numInp" list="numList" type="number" min="1" max="99" placeholder="班级" autocomplete="off">
          <span class="picker-sep">班</span>
        </div>
        <datalist id="yearList"></datalist>
        <datalist id="numList"></datalist>
        <button id="confirmBtn" class="btn btn-primary btn-block">确认班级</button>
        <p id="pickMsg" class="msg"></p>
      </div>
    </section>

    <!-- 操作页：根据班级当前状态显示可用操作 -->
    <section id="operate" class="panel hidden">
      <div class="panel-inner">
        <h1 id="clsName"></h1>
        <div class="card-mini">
          <div class="row">
            <span class="label">当前状态</span>
            <span id="curStatus" class="badge s0"></span>
          </div>
          <div class="row">
            <span class="label">更新时间</span>
            <span id="curTime" class="muted">—</span>
          </div>
        </div>

        <!-- 状态0：可点下课放学 -->
        <button id="btnStart" class="btn btn-main btn-block">下课放学</button>
        <!-- 状态1：可点到达校门 -->
        <button id="btnDone" class="btn btn-done btn-block" disabled>到达校门</button>
        <!-- 状态2：已完成 -->
        <div id="doneBox" class="hidden">
          <div class="card-mini" style="text-align:center;">
            <div style="font-size:16px;font-weight:700;color:var(--s2);">已放学完成</div>
            <div class="muted" style="font-size:13px;">该班级已到达校门，无需再操作</div>
          </div>
        </div>

        <div style="display:flex;gap:10px;">
          <button id="switchBtn" class="btn btn-ghost">切换班级</button>
        </div>
        <p id="opMsg" class="msg"></p>
      </div>
    </section>

    <!-- 结果页 -->
    <section id="result" class="panel hidden">
      <div class="panel-inner" style="align-items:center;text-align:center;">
        <h1 id="resultTitle" style="color:var(--s2);">操作成功</h1>
        <p id="resultDesc" class="hint"></p>
        <div class="card-mini" style="width:100%;">
          <div class="row">
            <span class="label">班级</span>
            <span id="rClass"></span>
          </div>
          <div class="row">
            <span class="label">当前状态</span>
            <span id="rStatus" class="badge s0"></span>
          </div>
        </div>
        <button id="againBtn" class="btn btn-primary btn-block">继续操作</button>
      </div>
    </section>
  </main>

<script>
let STATUS_LABELS = ["上课", "出教室", "抵达校门"];
let NAME_FMT = "cn";
let scanToken = "";
let currentClass = null;

const el = id => document.getElementById(id);

const CN_NUM = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
function cnNum(n) {
  if (n <= 10) return CN_NUM[n];
  if (n < 20) return "十" + CN_NUM[n - 10];
  return String(n);
}
function classLabel(c) {
  const m = String(c.class_name).match(/(\d+)年(?:级)?(\d+)班/);
  const grade = m ? m[1] : c.grade;
  const num = m ? m[2] : "";
  const g = cnNum(Number(grade));
  if (NAME_FMT === "cn") return `${g}（${num}）`;
  return `${g}年${num}班`;
}

function show(id) {
  ["pick", "operate", "result"].forEach(p => el(p).classList.add("hidden"));
  el(id).classList.remove("hidden");
}

async function init() {
  // 读取扫码凭证与状态标签
  try {
    const r = await fetch("/api/scan/info");
    const j = await r.json();
    if (!j.ok) { el("pickMsg").textContent = "无法获取扫码信息"; return; }
    scanToken = j.data.scanToken;
    if (j.data.nameFmt) NAME_FMT = j.data.nameFmt;
    if (Array.isArray(j.data.statusLabels) && j.data.statusLabels.length >= 3) {
      STATUS_LABELS = j.data.statusLabels;
    }
  } catch (e) {
    el("pickMsg").textContent = "网络不稳定，请重试";
    return;
  }
  // 加载班级列表，解析班级名提取年级与班级号
  try {
    const r = await fetch("/api/classes");
    const j = await r.json();
    const classes = j.data || [];
    // 收集年级与班级号，用于下拉快速选择
    const years = [...new Set(classes.map(c => {
      const m = String(c.class_name).match(/(\d+)年(?:级)?(\d+)班/);
      return m ? m[1] : "";
    }).filter(Boolean))].sort((a, b) => Number(a) - Number(b));
    const nums = [...new Set(classes.map(c => {
      const m = String(c.class_name).match(/(\d+)年(?:级)?(\d+)班/);
      return m ? m[2] : "";
    }).filter(Boolean))].sort((a, b) => Number(a) - Number(b));
    el("yearList").innerHTML = years.map(y => `<option value="${y}">`).join("");
    el("numList").innerHTML = nums.map(n => `<option value="${n}">`).join("");
    show("pick");
  } catch (e) {
    el("pickMsg").textContent = "网络不稳定，请重试";
  }
}

function renderStatus(c) {
  const st = c.status;
  const badge = el("curStatus");
  badge.className = "badge s" + st;
  badge.textContent = STATUS_LABELS[st] || STATUS_LABELS[0] || "状态";
  el("curTime").textContent = c.update_time ? c.update_time.slice(11) : "—";

  // 状态不可逆：0 -> 1 -> 2，按当前状态显示可用操作
  el("btnStart").disabled = st !== 0;
  el("btnDone").disabled = st !== 1;
  el("doneBox").classList.toggle("hidden", st !== 2);
}

async function confirmClass() {
  const year = el("yearInp").value.trim();
  const num = el("numInp").value.trim();
  if (!year || !num) { el("pickMsg").textContent = "请填写年级和班级号"; return; }
  el("pickMsg").textContent = "加载中…";
  try {
    const r = await fetch("/api/classes");
    const j = await r.json();
    // 按班级名正则解析，匹配对应年级和班级号的班级
    const c = (j.data || []).find(x => {
      const m = String(x.class_name).match(/(\d+)年(?:级)?(\d+)班/);
      return m && m[1] === year && m[2] === num;
    });
    if (!c) { el("pickMsg").textContent = "未找到对应班级，请检查年级或班级号"; return; }
    currentClass = c;
    el("clsName").textContent = classLabel(c);
    renderStatus(c);
    el("pickMsg").textContent = "";
    show("operate");
  } catch (e) {
    el("pickMsg").textContent = "网络不稳定，请重试";
  }
}

async function setStatus(status) {
  if (!currentClass) return;
  const btn = status === 1 ? el("btnStart") : el("btnDone");
  btn.disabled = true;
  const msg = el("opMsg");
  msg.textContent = "正在提交…";
  try {
    const r = await fetch("/api/scan/status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: scanToken, class_id: currentClass.class_id, status }),
    });
    const j = await r.json();
    if (Array.isArray(j.statusLabels) && j.statusLabels.length >= 3) {
      STATUS_LABELS = j.statusLabels;
    }
    if (j.ok) {
      msg.textContent = "";
      await refreshClass();
      showResult(status);
    } else {
      btn.disabled = false;
      msg.textContent = j.msg || "提交失败，请重试";
    }
  } catch (e) {
    btn.disabled = false;
    msg.textContent = "网络不稳定，请重试";
  }
}

async function refreshClass() {
  try {
    const r = await fetch("/api/classes");
    const j = await r.json();
    const c = (j.data || []).find(x => x.class_id === currentClass.class_id);
    if (c) currentClass = c;
  } catch (e) {}
}

function showResult(status) {
  const c = currentClass;
  const desc = status === 1 ? "已开始放学，学生走出班级" : "已确认到达校门";
  el("resultTitle").textContent = status === 1 ? "已开始放学" : "已到达校门";
  el("resultDesc").textContent = desc;
  el("rClass").textContent = classLabel(c);
  const badge = el("rStatus");
  badge.className = "badge s" + c.status;
  badge.textContent = STATUS_LABELS[c.status] || "状态";
  show("result");
}

el("confirmBtn").addEventListener("click", confirmClass);
const clearMsg = () => { el("pickMsg").textContent = ""; };
el("yearInp").addEventListener("input", clearMsg);
el("numInp").addEventListener("input", clearMsg);
el("btnStart").addEventListener("click", () => setStatus(1));
el("btnDone").addEventListener("click", () => setStatus(2));
el("switchBtn").addEventListener("click", () => {
  el("pickMsg").textContent = "";
  show("pick");
});
el("againBtn").addEventListener("click", () => {
  if (currentClass) {
    el("clsName").textContent = classLabel(currentClass);
    renderStatus(currentClass);
    show("operate");
  } else {
    show("pick");
  }
});

init();

// 静态资源更新自动刷新，绕过顽固缓存
(async function autoReloadOnAssetChange() {
  try {
    const r = await fetch("/api/ui-version", { cache: "no-store" });
    const j = await r.json();
    if (!j.ok) return;
    const key = "scan_ui_ver";
    const now = JSON.stringify(j.data);
    const prev = sessionStorage.getItem(key);
    if (prev === null) { sessionStorage.setItem(key, now); return; }
    if (prev !== now) { sessionStorage.setItem(key, now); location.reload(); }
  } catch (e) {}
  setTimeout(autoReloadOnAssetChange, 30000);
})();
</script>
</body>
</html>
