<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作端</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="app">
  <main class="app-main">
    <!-- 登录页：只输入手机号，登录后再选班级 -->
    <section id="login" class="panel">
      <div class="panel-inner">
        <h1>放学状态</h1>
        <p class="hint">输入手机号登录</p>
        <input id="phone" type="tel" inputmode="numeric" maxlength="11"
               placeholder="手机号" autocomplete="off">
        <button id="loginBtn" class="btn btn-primary btn-block">登录</button>
        <p id="loginMsg" class="msg"></p>
      </div>
    </section>

    <!-- 选班页：登录后选择要操作的班级 -->
    <section id="select" class="panel hidden">
      <div class="panel-inner">
        <h1>选择班级</h1>
        <p class="hint">请选择今天带领的班级</p>
        <select id="selectClass"></select>
        <button id="enterBtn" class="btn btn-primary btn-block">进入</button>
        <p id="selectMsg" class="msg"></p>
        <button id="logout1" class="btn btn-ghost btn-block">退出登录</button>
      </div>
    </section>

    <!-- 操作页：对已选班级进行操作 -->
    <section id="panel" class="panel hidden">
      <header class="panel-head">
        <h1 id="clsName"></h1>
        <div class="head-actions">
          <button id="switchBtn" class="btn btn-ghost">切换班级</button>
          <button id="logout" class="btn btn-ghost">退出</button>
        </div>
      </header>
      <div class="card-mini">
        <div class="row">
          <span class="label">当前状态</span>
          <span id="curStatus" class="badge s0"></span>
        </div>
        <div class="row">
          <span class="label">更新时间</span>
          <span id="curTime" class="muted">—</span>
        </div>
      </div>

      <button id="btnStart" class="btn btn-main btn-block">下课放学</button>
      <button id="btnDone" class="btn btn-done btn-block" disabled>到达校门</button>
      <p id="opMsg" class="msg"></p>
    </section>
  </main>

<script>
let me = null;
// 状态名称统一由后端下发（管理端「大屏显示设置」中的状态1/2/3名称），不硬编码
let STATUS_LABELS = ["上课", "出教室", "抵达校门"];
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
// 班级名格式由管理端下发，与大屏/扫码页保持一致
let NAME_FMT = "cn";

const el = id => document.getElementById(id);

const CN_NUM = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
function cnNum(n) {
  if (n <= 10) return CN_NUM[n];
  if (n < 20) return "十" + CN_NUM[n - 10];
  return String(n);
}
// 按管理端设置的格式显示班级名，兼容「1年1班」和「1年级1班」
function classLabel(c) {
  const m = String(c.class_name).match(/(\d+)年(?:级)?(\d+)班/);
  const grade = m ? m[1] : c.grade;
  const num = m ? m[2] : "";
  const g = cnNum(Number(grade));
  if (NAME_FMT === "cn") return `${g}（${num}）`;
  return `${g}年${num}班`;
}

function fillSelect(sel, classes, current) {
  sel.innerHTML = classes.map(c =>
    `<option value="${escapeHtml(c.class_id)}"${c.class_id === current ? " selected" : ""}>${escapeHtml(classLabel(c))}</option>`
  ).join("");
}

function applyLabels(j) {
  if (Array.isArray(j.statusLabels) && j.statusLabels.length >= 3) STATUS_LABELS = j.statusLabels;
}

function showLogin() {
  el("login").classList.remove("hidden");
  el("select").classList.add("hidden");
  el("panel").classList.add("hidden");
}

function showSelect() {
  el("login").classList.add("hidden");
  el("select").classList.remove("hidden");
  el("panel").classList.add("hidden");
}

function showPanel() {
  el("login").classList.add("hidden");
  el("select").classList.add("hidden");
  el("panel").classList.remove("hidden");
  const c = me.class;
  el("clsName").textContent = classLabel(c);
  renderStatus(c);
}

// 登录：只传手机号，不选班级
async function login() {
  const phone = el("phone").value.trim();
  if (!/^1\d{10}$/.test(phone)) {
    el("loginMsg").textContent = "请输入正确的手机号";
    return;
  }
  el("loginMsg").textContent = "正在登录…";
  try {
    const r = await fetch("/api/login?phone=" + encodeURIComponent(phone));
    const j = await r.json();
    applyLabels(j);
    if (j.ok && j.role === "teacher") {
      me = j;
      // 已绑定：用已绑定班级列表选择，默认选中当前班级
      const list = (j.classes && j.classes.length) ? j.classes : [j.class];
      fillSelect(el("selectClass"), list, j.class && j.class.class_id);
      el("selectMsg").textContent = "";
      showSelect();
      return;
    }
    el("loginMsg").textContent = j.msg || "登录失败";
  } catch (e) {
    el("loginMsg").textContent = "网络不稳定，请重试";
  }
}

// 选班后进入操作页
async function enterClass() {
  const cid = el("selectClass").value;
  if (!cid) {
    el("selectMsg").textContent = "请选择班级";
    return;
  }
  el("selectMsg").textContent = "正在进入…";
  try {
    const r = await fetch("/api/login?phone=" + encodeURIComponent(me.phone)
      + "&class_id=" + encodeURIComponent(cid));
    const j = await r.json();
    applyLabels(j);
    if (j.ok && j.role === "teacher" && j.class) {
      me = j;
      el("selectMsg").textContent = "";
      showPanel();
    } else {
      el("selectMsg").textContent = j.msg || "选择班级失败";
    }
  } catch (e) {
    el("selectMsg").textContent = "网络不稳定，请重试";
  }
}

function renderStatus(c) {
  const st = c.status;
  const badge = el("curStatus");
  badge.className = "badge s" + st;
  badge.textContent = STATUS_LABELS[st] || STATUS_LABELS[0] || "状态";
  el("curTime").textContent = c.update_time ? c.update_time.slice(11) : "—";

  // 状态不可逆，按 0 -> 1 -> 2 顺序推进，不可跳级
  el("btnStart").disabled = st >= 1;   // 下课放学：状态0时可点，状态1/2后变灰
  el("btnDone").disabled = st !== 1;    // 到达校门：仅状态1时可点，状态0/2时变灰
}

async function setStatus(status) {
  if (!me || me.role !== "teacher" || !me.class) return;
  const btn = status === 1 ? el("btnStart") : el("btnDone");
  btn.disabled = true;
  const msg = el("opMsg");
  msg.textContent = "正在提交…";

  try {
    const r = await fetch("/api/status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: me.token, class_id: me.class.class_id, status }),
    });
    const j = await r.json();
    if (j.ok) {
      msg.textContent = "";
      await refresh();
    } else {
      btn.disabled = false;
      msg.textContent = j.msg || "提交失败，请重试";
    }
  } catch (e) {
    btn.disabled = false;
    msg.textContent = "网络不稳定，请重试";
  }
}

async function refresh() {
  const r = await fetch("/api/classes");
  const j = await r.json();
  if (!j.ok || !me || me.role !== "teacher" || !me.class) return;
  const c = j.data.find(x => x.class_id === me.class.class_id);
  if (c) { me.class = c; renderStatus(c); }
}

el("loginBtn").addEventListener("click", () => cfgReady.then(login));
el("phone").addEventListener("keydown", e => { if (e.key === "Enter") cfgReady.then(login); });
el("enterBtn").addEventListener("click", enterClass);
el("selectClass").addEventListener("change", () => { el("selectMsg").textContent = ""; });
el("btnStart").addEventListener("click", () => setStatus(1));
el("btnDone").addEventListener("click", () => setStatus(2));
el("switchBtn").addEventListener("click", () => {
  if (!me || me.role !== "teacher") return;
  const list = (me.classes && me.classes.length) ? me.classes : [me.class];
  fillSelect(el("selectClass"), list, me.class && me.class.class_id);
  el("selectMsg").textContent = "";
  showSelect();
});
function doLogout() {
  me = null;
  STATUS_LABELS = ["上课", "出教室", "抵达校门"];
  el("phone").value = "";
  el("loginMsg").textContent = "";
  el("selectMsg").textContent = "";
  showLogin();
}
el("logout").addEventListener("click", doLogout);
el("logout1").addEventListener("click", doLogout);

// 读取显示配置（班级名格式、状态名称），与大屏/管理端保持一致
let cfgReady = fetch("/api/display").then(r => r.json()).then(j => {
  if (j.ok && j.data) {
    if (j.data.nameFmt) NAME_FMT = j.data.nameFmt;
    if (Array.isArray(j.data.statusLabels) && j.data.statusLabels.length >= 3) STATUS_LABELS = j.data.statusLabels;
    // 若已展示操作页，按最新配置刷新标题与状态
    if (me && me.class && !el("panel").classList.contains("hidden")) {
      el("clsName").textContent = classLabel(me.class);
      renderStatus(me.class);
    }
  }
}).catch(() => {});

// 已登录状态从查询参数恢复（仅手机号，登录后仍需选班）
const q = new URLSearchParams(location.search);
if (q.get("phone")) {
  el("phone").value = q.get("phone");
  cfgReady.then(login);
}

// 静态资源更新自动刷新，绕过顽固缓存
(async function autoReloadOnAssetChange() {
  try {
    const r = await fetch("/api/ui-version", { cache: "no-store" });
    const j = await r.json();
    if (!j.ok) return;
    const key = "ctl_ui_ver";
    const now = JSON.stringify(j.data);
    const prev = sessionStorage.getItem(key);
    if (prev === null) { sessionStorage.setItem(key, now); return; }
    if (prev !== now) { sessionStorage.setItem(key, now); location.reload(); }
  } catch (e) {}
  setTimeout(autoReloadOnAssetChange, 30000);
})();
</script>
</body>
</html>
