name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-pc-windows-msvc
            runtime: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-v1.13.6-win-x64-shared-MT-Release-lib.tar.bz2
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Download offline assets
        shell: bash
        run: |
          mkdir -p offline/runtime offline/model
          curl -L --fail -o runtime.tar.bz2 "${{ matrix.runtime }}"
          tar -xjf runtime.tar.bz2 -C offline/runtime
          curl -L --fail -o model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-vits-zh-ll.tar.bz2"
          tar -xjf model.tar.bz2 -C offline/model --strip-components=1

      - name: Build Windows packages
        shell: pwsh
        run: |
          .\build-win.ps1 -Target "${{ matrix.target }}" -Arch "${{ matrix.arch }}"
          bash build-offline.sh win ${{ matrix.arch }}
          $nsisPaths = @('C:\Program Files (x86)\NSIS\makensis.exe', 'C:\Program Files\NSIS\makensis.exe')
          $nsis = $nsisPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            winget install --id NSIS.NSIS --silent --accept-package-agreements --accept-source-agreements
            $nsis = $nsisPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $nsis) {
            choco install nsis -y --no-progress
            $nsis = $nsisPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $nsis) { throw 'NSIS not found' }
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v?(\d+\.\d+\.\d+.*)$') { $ver = $Matches[1] } else { $ver = "2.0.0" }
          & $nsis /V2 /DARCH=${{ matrix.arch }} /DAPP_VERSION=$ver /DVARIANT=online '/DAPP_TITLE=LeaveBell Online' '/DAPP_DIR=LeaveBell-online' '/DREG_KEY=Software\LeaveBell\online' /DPKG_DIR="dist-native\online-${{ matrix.arch }}" installer.nsi
          & $nsis /V2 /DARCH=${{ matrix.arch }} /DAPP_VERSION=$ver /DVARIANT=offline '/DAPP_TITLE=LeaveBell Offline' '/DAPP_DIR=LeaveBell-offline' '/DREG_KEY=Software\LeaveBell\offline' /DPKG_DIR="dist-offline\win-${{ matrix.arch }}" installer.nsi
          & $nsis /V2 /DARCH=${{ matrix.arch }} /DAPP_VERSION=$ver /DVARIANT=screen /DSCREEN '/DAPP_TITLE=LeaveBell Screen' '/DAPP_DIR=LeaveBell-screen' '/DREG_KEY=Software\LeaveBell\screen' /DPKG_DIR="dist-native\screen-${{ matrix.arch }}" installer.nsi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.arch }}
          path: |
            LeaveBell-online-windows-${{ matrix.arch }}.exe
            LeaveBell-offline-windows-${{ matrix.arch }}.exe
            LeaveBell-screen-windows-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Upload Windows payload
        uses: actions/upload-artifact@v4
        with:
          name: win-payload-${{ matrix.arch }}
          path: |
            dist-native/online-${{ matrix.arch }}/LeaveBell.exe
            dist-native/online-${{ matrix.arch }}/LeaveBellScreen.exe
            dist-native/screen-${{ matrix.arch }}/LeaveBellScreen.exe
            dist-offline/win-${{ matrix.arch }}/LeaveBell.exe
            dist-offline/win-${{ matrix.arch }}/sherpa-onnx-c-api.dll
            dist-offline/win-${{ matrix.arch }}/models/sherpa-onnx-vits-zh-ll/model.onnx
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runtime: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-v1.13.6-linux-x64-shared-lib.tar.bz2
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runtime: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-v1.13.6-linux-aarch64-shared-cpu-lib.tar.bz2
    runs-on: ubuntu-latest
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev rpm
          if [ "${{ matrix.arch }}" = "arm64" ]; then sudo apt-get install -y gcc-aarch64-linux-gnu; fi

      - name: Download offline assets
        shell: bash
        run: |
          mkdir -p offline/runtime offline/model
          curl -L --fail -o runtime.tar.bz2 "${{ matrix.runtime }}"
          tar -xjf runtime.tar.bz2 -C offline/runtime
          curl -L --fail -o model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-vits-zh-ll.tar.bz2"
          tar -xjf model.tar.bz2 -C offline/model --strip-components=1

      - name: Build Linux packages
        shell: bash
        run: |
          bash build-linux.sh "${{ matrix.target }}" "${{ matrix.arch }}"
          bash build-offline.sh linux "${{ matrix.arch }}"
          bash build-linux-packages.sh "${{ matrix.arch }}" online
          bash build-linux-packages.sh "${{ matrix.arch }}" offline
          bash build-linux-packages.sh "${{ matrix.arch }}" screen

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            LeaveBell-online-linux-${{ matrix.arch }}.deb
            LeaveBell-online-linux-${{ matrix.arch }}.rpm
            LeaveBell-offline-linux-${{ matrix.arch }}.deb
            LeaveBell-offline-linux-${{ matrix.arch }}.rpm
            LeaveBell-screen-linux-${{ matrix.arch }}.deb
            LeaveBell-screen-linux-${{ matrix.arch }}.rpm
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Prepare signing keystore
        shell: bash
        env:
          LB_KEYSTORE_B64: ${{ secrets.LB_KEYSTORE_B64 }}
        run: |
          if [ -z "$LB_KEYSTORE_B64" ]; then
            echo "LB_KEYSTORE_B64 not set; will build unsigned debug APK"
          else
            echo "$LB_KEYSTORE_B64" | tr -d '[:space:]' | base64 -di > "$RUNNER_TEMP/leavebell.jks"
            echo "LB_KEYSTORE_FILE=$RUNNER_TEMP/leavebell.jks" >> "$GITHUB_ENV"
            echo "LB_KEYSTORE_PASSWORD=${{ secrets.LB_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LB_KEY_ALIAS=${{ secrets.LB_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LB_KEY_PASSWORD=${{ secrets.LB_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build Android Screen APK (arm64)
        shell: bash
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$RUNNER_TEMP/gradle-8.7/bin:$PATH"
          cd android-screen
          if [ -n "$LB_KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../LeaveBell-Screen-android.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../LeaveBell-Screen-android.apk
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: LeaveBell-Screen-android.apk
          if-no-files-found: error

  verify-linux:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts
          merge-multiple: true

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libxkbcommon0 libwayland-client0 libx11-6 libasound2t64 || sudo apt-get install -y rpm libxkbcommon0 libwayland-client0 libx11-6 libasound2

      - name: Verify Linux packages
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) deb_arch=amd64; rpm_arch=x86_64 ;;
              arm64) deb_arch=arm64; rpm_arch=aarch64 ;;
            esac
            for variant in online offline screen; do
              deb="artifacts/LeaveBell-$variant-linux-$arch.deb"
              rpm="artifacts/LeaveBell-$variant-linux-$arch.rpm"
              test -f "$deb"
              test -f "$rpm"
              dpkg-deb -c "$deb" >/dev/null
              test "$(dpkg-deb -f "$deb" Architecture)" = "$deb_arch"
              rpm -qlp "$rpm" >/dev/null
              test "$(rpm -qp --qf '%{ARCH}' "$rpm")" = "$rpm_arch"

              case "$deb" in
                *.deb) list=$(dpkg-deb -c "$deb") ;;
              esac
              case "$variant" in
                online)
                  echo "$list" | grep -q 'LeaveBell.bin'
                  echo "$list" | grep -q 'LeaveBellScreen.bin'
                  if echo "$list" | grep -q 'model.onnx'; then echo "online contains model: $deb"; exit 1; fi ;;
                offline)
                  echo "$list" | grep -q 'LeaveBell.bin'
                  echo "$list" | grep -q 'LeaveBellScreen.bin'
                  echo "$list" | grep -q 'model.onnx'
                  echo "$list" | grep -q 'libsherpa-onnx-c-api.so' ;;
                screen)
                  echo "$list" | grep -q 'LeaveBellScreen.bin'
                  if echo "$list" | grep -q 'LeaveBell.bin'; then echo "screen contains controller: $deb"; exit 1; fi
                  if echo "$list" | grep -q 'model.onnx'; then echo "screen contains model: $deb"; exit 1; fi ;;
              esac

              if [ "$arch" = "amd64" ] && [ "$variant" != "screen" ]; then
                rm -rf "verify-$variant"
                dpkg-deb -x "$deb" "verify-$variant"
                exe=$(find "verify-$variant" -type f -name LeaveBell.bin | head -n 1)
                dir=$(dirname "$exe")
                (cd "$dir" && timeout 30 ./LeaveBell.bin --license-check)
                test -f "$dir/license-tool-result.txt"
                rm -f "$dir/license-tool-result.txt"
                if ldd "$exe" | grep -q 'not found'; then echo "missing shared library: $exe"; exit 1; fi
              fi
            done
          done

  verify-win:
    needs: build-win
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: win-*
          path: artifacts

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-File($path) {
            if (-not (Test-Path $path)) { throw "Missing $path" }
            if ((Get-Item $path).Length -le 0) { throw "Empty $path" }
          }
          function Assert-Pe($path) {
            Assert-File $path
            $stream = [System.IO.File]::OpenRead($path)
            try { $b0 = $stream.ReadByte(); $b1 = $stream.ReadByte() } finally { $stream.Dispose() }
            if ($b0 -ne 0x4D -or $b1 -ne 0x5A) { throw "Not PE: $path" }
          }
          $arch = 'amd64'
          foreach ($variant in @('online','offline','screen')) {
            Assert-Pe "artifacts/win-$arch/LeaveBell-$variant-windows-$arch.exe"
          }
          $payload = "artifacts/win-payload-$arch"
          $onlineExe = "$payload/dist-native/online-$arch/LeaveBell.exe"
          $onlineDisplay = "$payload/dist-native/online-$arch/LeaveBellScreen.exe"
          $screenDisplay = "$payload/dist-native/screen-$arch/LeaveBellScreen.exe"
          $offlineExe = "$payload/dist-offline/win-$arch/LeaveBell.exe"
          $dll = "$payload/dist-offline/win-$arch/sherpa-onnx-c-api.dll"
          $model = "$payload/dist-offline/win-$arch/models/sherpa-onnx-vits-zh-ll/model.onnx"
          Assert-Pe $onlineExe
          Assert-Pe $onlineDisplay
          Assert-Pe $screenDisplay
          Assert-Pe $offlineExe
          Assert-File $dll
          Assert-File $model

          $exePath = (Resolve-Path $onlineExe).Path
          $dir = Split-Path $exePath
          $result = Join-Path $dir 'license-tool-result.txt'
          Remove-Item $result -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exePath -ArgumentList '--license-check' -WorkingDirectory $dir -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -ne 0) { throw "license-check failed: $onlineExe" }
          if (-not (Test-Path $result)) { throw "missing result: $result" }
          if ((Get-Content $result -Raw) -notmatch 'registered=') { throw "bad result: $result" }
          Remove-Item $result -ErrorAction SilentlyContinue

  release:
    needs: [build-win, build-linux, verify-linux, verify-win, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LeaveBell-*-windows-*.exe
            release/LeaveBell-*-linux-*.deb
            release/LeaveBell-*-linux-*.rpm
            release/LeaveBell-Screen-android.apk
          generate_release_notes: true
