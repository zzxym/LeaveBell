name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-pc-windows-msvc
            runtime: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-v1.13.6-win-x64-shared-MT-Release-lib.tar.bz2
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runtime: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-v1.13.6-win-arm64-shared-MT-Release-lib.tar.bz2
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Download offline assets
        shell: bash
        run: |
          mkdir -p offline/runtime offline/model
          curl -L --fail -o runtime.tar.bz2 "${{ matrix.runtime }}"
          tar -xjf runtime.tar.bz2 -C offline/runtime
          curl -L --fail -o model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-melo-tts-zh_en.tar.bz2"
          tar -xjf model.tar.bz2 -C offline/model --strip-components=1

      - name: Build Windows packages
        shell: pwsh
        run: |
          .\build-win.ps1 -Target "${{ matrix.target }}" -Arch "${{ matrix.arch }}"
          $nsisPaths = @('C:\Program Files (x86)\NSIS\makensis.exe', 'C:\Program Files\NSIS\makensis.exe')
          $nsis = $nsisPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            winget install --id NSIS.NSIS --silent --accept-package-agreements --accept-source-agreements
            $nsis = $nsisPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $nsis) {
            choco install nsis -y --no-progress
            $nsis = $nsisPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $nsis) { throw 'NSIS not found' }
          $pkg = "dist-native\school-display-${{ matrix.arch }}"
          & $nsis /V2 /DARCH=${{ matrix.arch }} /DPKG_DIR="$pkg" installer.nsi
          bash build-offline.sh win ${{ matrix.arch }}
          $offline = "dist-offline\win-${{ matrix.arch }}"
          & $nsis /V2 /DARCH=${{ matrix.arch }} /DPKG_DIR="$offline" installer-melo-patch.nsi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.arch }}
          path: |
            LeaveBell-Online-Setup-${{ matrix.arch }}.exe
            LeaveBell-LocalVoice-Patch-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Upload Windows payload
        uses: actions/upload-artifact@v4
        with:
          name: win-payload-${{ matrix.arch }}
          path: |
            dist-native/school-display-${{ matrix.arch }}/LeaveBell.exe
            dist-offline/win-${{ matrix.arch }}/LeaveBell.exe
            dist-offline/win-${{ matrix.arch }}/sherpa-onnx-c-api.dll
            dist-offline/win-${{ matrix.arch }}/melo/models/sherpa-onnx-vits-zh-ll/model.onnx
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runtime: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-v1.13.6-linux-x64-shared-lib.tar.bz2
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runtime: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-v1.13.6-linux-aarch64-shared-cpu-lib.tar.bz2
    runs-on: ubuntu-latest
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev rpm
          if [ "${{ matrix.arch }}" = "arm64" ]; then sudo apt-get install -y gcc-aarch64-linux-gnu; fi

      - name: Download offline assets
        shell: bash
        run: |
          mkdir -p offline/runtime offline/model
          curl -L --fail -o runtime.tar.bz2 "${{ matrix.runtime }}"
          tar -xjf runtime.tar.bz2 -C offline/runtime
          curl -L --fail -o model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-melo-tts-zh_en.tar.bz2"
          tar -xjf model.tar.bz2 -C offline/model --strip-components=1

      - name: Build Linux packages
        shell: bash
        run: |
          bash build-linux.sh "${{ matrix.target }}" "${{ matrix.arch }}"
          bash build-offline.sh linux "${{ matrix.arch }}"
          bash build-linux-packages.sh "${{ matrix.arch }}" offline
          bash build-linux-packages.sh "${{ matrix.arch }}" online

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            LeaveBell-Online-Linux-${{ matrix.arch }}.tar.gz
            LeaveBell-Offline-Linux-${{ matrix.arch }}.tar.gz
            LeaveBell-${{ matrix.arch }}.deb
            LeaveBell-${{ matrix.arch }}.rpm
            LeaveBell-Online-${{ matrix.arch }}.deb
            LeaveBell-Online-${{ matrix.arch }}.rpm
          if-no-files-found: error

  verify-linux:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts
          merge-multiple: true

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libxkbcommon0 libwayland-client0 libx11-6 libasound2t64 || sudo apt-get install -y rpm libxkbcommon0 libwayland-client0 libx11-6 libasound2

      - name: Verify Linux archives
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            online_tar="artifacts/LeaveBell-Online-Linux-$arch.tar.gz"
            offline_tar="artifacts/LeaveBell-Offline-Linux-$arch.tar.gz"
            test -f "$online_tar"
            test -f "$offline_tar"
            rm -rf "online-$arch" "offline-$arch"
            mkdir -p "online-$arch" "offline-$arch"
            tar -xzf "$online_tar" -C "online-$arch"
            tar -xzf "$offline_tar" -C "offline-$arch"
            on="online-$arch/LeaveBell-$arch"
            off="offline-$arch/linux-$arch"
            test -x "$on/LeaveBell"
            test -f "$on/LeaveBell.bin"
            test -x "$off/LeaveBell"
            test -f "$off/LeaveBell.bin"
            test -f "$off/libsherpa-onnx-c-api.so"
            test -f "$off/melo/models/sherpa-onnx-vits-zh-ll/model.onnx"
            if [ "$arch" = "amd64" ]; then
              (cd "$on" && timeout 30 ./LeaveBell --license-check)
              grep -q '^registered=' "$on/license-tool-result.txt"
              rm -f "$on/license-tool-result.txt"
              (cd "$off" && timeout 30 ./LeaveBell --license-check)
              grep -q '^registered=' "$off/license-tool-result.txt"
              rm -f "$off/license-tool-result.txt"
              if ldd "$on/LeaveBell.bin" | grep -q 'not found'; then echo "missing shared library in $on"; exit 1; fi
              if ldd "$off/LeaveBell.bin" | grep -q 'not found'; then echo "missing shared library in $off"; exit 1; fi
            else
              file "$on/LeaveBell.bin" | grep -q 'aarch64'
              file "$off/LeaveBell.bin" | grep -q 'aarch64'
            fi
          done

      - name: Verify Linux packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in artifacts/LeaveBell-*.deb artifacts/LeaveBell-*.rpm; do
            case "$pkg" in
              *.deb) dpkg-deb -c "$pkg" >/dev/null; dpkg-deb -f "$pkg" Architecture | grep -q . ;;
              *.rpm) rpm -qlp "$pkg" >/dev/null; rpm -qp --qf '%{ARCH}\n' "$pkg" | grep -q . ;;
            esac
            case "$pkg" in
              *.deb) list=$(dpkg-deb -c "$pkg") ;;
              *.rpm) list=$(rpm -qlp "$pkg") ;;
            esac
            case "$pkg" in
              *Online-*)
                if echo "$list" | grep -q 'model.onnx'; then echo "online package contains offline model: $pkg"; exit 1; fi ;;
              *)
                echo "$list" | grep -q 'model.onnx'
                echo "$list" | grep -q 'libsherpa-onnx-c-api.so' ;;
            esac
          done

  verify-win:
    needs: build-win
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: win-*
          path: artifacts

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-File($path) {
            if (-not (Test-Path $path)) { throw "Missing $path" }
            if ((Get-Item $path).Length -le 0) { throw "Empty $path" }
          }
          function Assert-Pe($path) {
            Assert-File $path
            $stream = [System.IO.File]::OpenRead($path)
            try { $b0 = $stream.ReadByte(); $b1 = $stream.ReadByte() } finally { $stream.Dispose() }
            if ($b0 -ne 0x4D -or $b1 -ne 0x5A) { throw "Not PE: $path" }
          }
          foreach ($arch in @('amd64','arm64')) {
            $setup = "artifacts/win-$arch/LeaveBell-Online-Setup-$arch.exe"
            $patch = "artifacts/win-$arch/LeaveBell-LocalVoice-Patch-$arch.exe"
            Assert-Pe $setup
            Assert-Pe $patch
            $payload = "artifacts/win-payload-$arch"
            $onlineExe = "$payload/dist-native/school-display-$arch/LeaveBell.exe"
            $offlineExe = "$payload/dist-offline/win-$arch/LeaveBell.exe"
            $dll = "$payload/dist-offline/win-$arch/sherpa-onnx-c-api.dll"
            $model = "$payload/dist-offline/win-$arch/melo/models/sherpa-onnx-vits-zh-ll/model.onnx"
            Assert-Pe $onlineExe
            Assert-Pe $offlineExe
            Assert-File $dll
            Assert-File $model
            if ($arch -eq 'amd64') {
              $exePath = (Resolve-Path $onlineExe).Path
              $dir = Split-Path $exePath
              $result = Join-Path $dir 'license-tool-result.txt'
              Remove-Item $result -ErrorAction SilentlyContinue
              Push-Location $dir
              try {
                & $exePath --license-check
                $code = $LASTEXITCODE
              } finally { Pop-Location }
              if ($code -ne 0) { throw "license-check failed: $onlineExe" }
              if (-not (Test-Path $result)) { throw "missing result: $result" }
              if ((Get-Content $result -Raw) -notmatch 'registered=') { throw "bad result: $result" }
              Remove-Item $result -ErrorAction SilentlyContinue
            }
          }

  release:
    needs: [build-win, build-linux, verify-linux, verify-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LeaveBell-Online-Setup-*.exe
            release/LeaveBell-LocalVoice-Patch-*.exe
            release/LeaveBell-Online-Linux-*.tar.gz
            release/LeaveBell-Offline-Linux-*.tar.gz
            release/LeaveBell-*.deb
            release/LeaveBell-*.rpm
          generate_release_notes: true
